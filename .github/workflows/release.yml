name: Release

on:
  push:
    tags:
      - 'v*'

# This workflow holds NPM_TOKEN and publishes signed artifacts, so every job
# starts from the minimum and opts in to what it needs. Third-party actions are
# pinned to a commit SHA: a mutable tag in a job with the publish token is a
# direct path to a supply-chain compromise of `@engramo/mcp`.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: engramo-mcp-linux-x64
            use_zigbuild: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: engramo-mcp-linux-arm64
            use_zigbuild: true
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: engramo-mcp-darwin-arm64
            use_zigbuild: false
          - runner: macos-latest
            target: x86_64-apple-darwin
            artifact: engramo-mcp-darwin-x64
            use_zigbuild: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # Required explicitly: pinned by SHA, the action can no longer infer the
          # toolchain from the `@stable` ref.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild (Linux)
        if: matrix.use_zigbuild
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2

      - name: Install cargo-zigbuild (Linux)
        if: matrix.use_zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build (Linux, zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (macOS)
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/engramo-mcp ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            engramo-mcp-linux-x64
            engramo-mcp-linux-arm64
            engramo-mcp-darwin-arm64
            engramo-mcp-darwin-x64

  npm-publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance`: npm exchanges this for a signed
      # attestation tying each published tarball to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          declare -A PLATFORMS=(
            ["darwin-arm64"]="engramo-mcp-darwin-arm64"
            ["darwin-x64"]="engramo-mcp-darwin-x64"
            ["linux-arm64"]="engramo-mcp-linux-arm64"
            ["linux-x64"]="engramo-mcp-linux-x64"
          )

          for platform in "${!PLATFORMS[@]}"; do
            artifact="${PLATFORMS[$platform]}"
            pkg_dir="./npm/platforms/$platform"

            # Set version directly to avoid npm version git interactions
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$pkg_dir/package.json', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('$pkg_dir/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "

            # Copy binary and make executable
            cp "$artifact" "$pkg_dir/engramo-mcp"
            chmod +x "$pkg_dir/engramo-mcp"

            npm publish "$pkg_dir" --access public --provenance
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          pkg_dir="./npm/engramo-mcp"

          # Update version and optionalDependency versions directly
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('$pkg_dir/package.json', 'utf8'));
            pkg.version = '$VERSION';
            for (const dep of Object.keys(pkg.optionalDependencies)) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            fs.writeFileSync('$pkg_dir/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          npm publish "$pkg_dir" --access public --provenance
