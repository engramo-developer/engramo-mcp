name: CI

on:
  push:
    branches: [main]
    # Test / Audit are required checks in the main ruleset, so workflow- and
    # Dependabot-config-only PRs have to trigger them too or they never merge.
    # Same reasoning covers docs/markdown-only PRs (e.g. this repo's own
    # dependency-maintenance TODO): without a matching path here, a docs-only
    # PR can never satisfy its own required checks.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'docs/**'
      - 'mcpb/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'docs/**'
      - 'mcpb/**'
      - '**.md'
  # Advisories land without anyone pushing, so audit on a timer too.
  schedule:
    - cron: '17 6 * * 1'

# Third-party actions run with the smallest possible token.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # Required explicitly: pinned by SHA, the action can no longer infer the
          # toolchain from the `@stable` ref.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Lint mcpb Linux launcher
        run: shellcheck -s sh mcpb/linux-launcher.sh

      - name: Smoke-test mcpb Linux launcher
        run: |
          set -eu
          stage=$(mktemp -d)
          cp mcpb/linux-launcher.sh "$stage/engramo-mcp"
          cp target/debug/engramo-mcp "$stage/engramo-mcp-x64"
          chmod 644 "$stage/engramo-mcp-x64"            # exercise the exec-bit restore branch
          # happy path: invoked as the manifest does (/bin/sh <abs path>) from an unrelated cwd
          out=$(cd / && /bin/sh "$stage/engramo-mcp" --version)
          case $out in "engramo-mcp "*) ;; *) echo "unexpected: $out"; exit 1 ;; esac
          test -x "$stage/engramo-mcp-x64"
          # unsupported-arch branch: shadow uname
          mkdir "$stage/fakebin"
          printf '#!/bin/sh\necho riscv64\n' > "$stage/fakebin/uname"; chmod +x "$stage/fakebin/uname"
          if PATH="$stage/fakebin:$PATH" /bin/sh "$stage/engramo-mcp" --version 2>"$stage/err.txt"; then
            echo "expected failure on unsupported arch"; exit 1
          fi
          grep -q "unsupported CPU architecture 'riscv64'" "$stage/err.txt"

      - name: Test
        run: cargo test --workspace

  # Release builds a Windows binary, and mp3lame-sys takes a different
  # (cc-crate, MSVC) build path for LAME on a Windows host than on unix — so
  # catch a Windows build or test break on the PR, not at tag time.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Installed from source rather than via a marketplace action: this job
      # exists to reduce supply-chain exposure, not to add another action to it.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit --deny warnings

  # Deliberately NOT a required check: the packer only runs at release time on
  # staged artifacts, so an npm advisory must not block unrelated Rust PRs.
  # release.yml's mcpb job re-runs this audit so a vulnerable packer can't ship.
  # The job also validates mcpb/manifest.json against the schema; validation runs
  # even when the audit step fails so an advisory can't hide a manifest break.
  audit-mcpb-tools:
    name: Audit mcpb tools (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit
        run: node mcpb/tools/audit.mjs

      - name: Install mcpb CLI (locked)
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts --prefix mcpb/tools

      - name: Validate manifest
        if: ${{ !cancelled() }}
        run: mcpb/tools/node_modules/.bin/mcpb validate mcpb/manifest.json
