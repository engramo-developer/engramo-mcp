[package]
name = "engramo-mcp"
version = "0.1.0"
edition = "2024"
authors = ["Volodymyr Dotsenko <volmyrdot@gmail.com>"]
repository = "https://github.com/engramo-developer/engramo-mcp"

[[bin]]
name = "engramo-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
rmcp = { version = "1.3", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server", "reqwest"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
